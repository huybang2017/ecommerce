server:
  port: 8000
  mode: "debug"
  read_timeout: 30s
  write_timeout: 30s

jwt:
  secret: "your-secret-key-change-in-production"
  expiration: 24h
  issuer: "api-gateway"

rate_limit:
  enabled: true
  requests_per_minute: 100
  burst: 20
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3010"
    - "http://localhost:3020"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Requested-With"
    - "X-App-Role"
    - "Cookie"
    - "Set-Cookie"
  expose_headers:
    - "Set-Cookie"
  allow_credentials: true
  max_age: 12h

services:
  product_service:
    base_url: "http://localhost:8080" 
    timeout: 30s
    health_check_path: "/health"
    routes:
      - path: "/api/v1/products"
        methods: ["GET", "POST"]
        require_auth: false 
      - path: "/api/v1/products/:id"
        methods: ["GET"]
        require_auth: false 
      - path: "/api/v1/products/:id"
        methods: ["PUT", "DELETE"]
        require_auth: true 
      - path: "/api/v1/products/search"
        methods: ["GET"]
        require_auth: false
      - path: "/api/v1/products/:id/inventory"
        methods: ["PATCH"]
        require_auth: true
      - path: "/api/v1/categories"
        methods: ["GET", "POST"]
        require_auth: false
      - path: "/api/v1/categories/:id"
        methods: ["GET", "PUT", "DELETE"]
        require_auth: false
      - path: "/api/v1/categories/slug/:slug"
        methods: ["GET"]
        require_auth: false
      - path: "/api/v1/categories/:id/children"
        methods: ["GET"]
        require_auth: false
      - path: "/api/v1/categories/:id/products"
        methods: ["GET"]
        require_auth: false

  identity_service:
    base_url: "http://localhost:8081"
    timeout: 30s
    health_check_path: "/health"
    routes:
      - path: "/api/v1/auth/register"
        methods: ["POST"]
        require_auth: false
      - path: "/api/v1/auth/login"
        methods: ["POST"]
        require_auth: false
      - path: "/api/v1/auth/refresh"
        methods: ["POST"]
        require_auth: false
      - path: "/api/v1/auth/logout"
        methods: ["POST"]
        require_auth: true
      - path: "/api/v1/users/profile"
        methods: ["GET", "PUT"]
        require_auth: true
      - path: "/api/v1/users/password"
        methods: ["PUT"]
        require_auth: true
      - path: "/api/v1/addresses"
        methods: ["GET", "POST"]
        require_auth: true
      - path: "/api/v1/addresses/:id"
        methods: ["GET", "PUT", "DELETE"]
        require_auth: true
      - path: "/api/v1/addresses/:id/default"
        methods: ["PUT"]
        require_auth: true
      - path: "/api/v1/shops"
        methods: ["GET", "POST"]
        require_auth: false 
      - path: "/api/v1/shops/my-shop"
        methods: ["GET"]
        require_auth: true
      - path: "/api/v1/shops/:id"
        methods: ["GET", "PUT", "DELETE"]
        require_auth: false 
      - path: "/api/v1/shops/:id/status"
        methods: ["PUT"]
        require_auth: true

  search_service:
    base_url: "http://localhost:8002"
    timeout: 30s
    health_check_path: "/health"
    routes:
      - path: "/api/v1/search"
        methods: ["GET"]
        require_auth: false

  order_service:
    base_url: "http://localhost:8083"
    timeout: 30s
    health_check_path: "/health"
    routes:
      - path: "/api/v1/cart"
        methods: ["GET", "DELETE"]
        require_auth: false
      - path: "/api/v1/cart/items"
        methods: ["POST"]
        require_auth: false
      - path: "/api/v1/cart/items/:product_id"
        methods: ["PUT", "DELETE"]
        require_auth: false
      - path: "/api/v1/orders"
        methods: ["GET", "POST"]
        require_auth: false 
      - path: "/api/v1/orders/:id"
        methods: ["GET"]
        require_auth: false
      - path: "/api/v1/orders/number/:order_number"
        methods: ["GET"]
        require_auth: false

logging:
  level: "debug"
  encoding: "console" 
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"
