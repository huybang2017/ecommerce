basePath: /api/v1
host: localhost:8000
info:
  contact:
    email: support@example.com
    name: API Support
  description: Comprehensive API documentation for the Ecommerce Platform. All endpoints
    are accessed through the API Gateway which acts as a reverse proxy to backend
    microservices (Identity Service, Product Service, Order Service, etc.). The Gateway
    automatically forwards cookies, headers, and user context to backend services.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Ecommerce Platform API Gateway
  version: "2.0"
paths: {}
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT access token. Example:
      "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: HttpOnly cookie containing JWT access token. Automatically set after
      login/register. Used for authentication in browser-based applications.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
