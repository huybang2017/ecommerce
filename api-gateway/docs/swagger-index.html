<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>API Gateway - Swagger UI (Multi-service)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      #swagger-ui { height: calc(100vh - 48px); }
      #role_bar {
        padding: 8px 16px;
        background: #1a1a2e;
        color: #eee;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: monospace;
        font-size: 13px;
        border-bottom: 2px solid #e74c3c;
      }
      #role_bar label { color: #aaa; }
      #role_select {
        background: #2c2c54;
        border: 1px solid #555;
        color: #eee;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #role_badge {
        padding: 3px 12px;
        border-radius: 12px;
        font-weight: bold;
        font-size: 12px;
        background: #27ae60;
        color: #fff;
        transition: background 0.2s;
      }
      #role_hint {
        font-size: 12px;
        color: #888;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Role selector — chỉ cần chọn role, cookie browser tự gửi -->
    <div id="role_bar">
      <label>X-App-Role:</label>
      <select id="role_select">
        <option value="buyer">buyer</option>
        <option value="admin">admin</option>
        <option value="seller">seller</option>
      </select>
      <span id="role_badge">buyer</span>
      <span id="role_hint">
        Cookie browser gửi tự động — chỉ cần chọn đúng role tương ứng với session đang đăng nhập
      </span>
    </div>

    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
    <script>
      // ── Role selector ────────────────────────────────────────────────────────
      const BADGE_COLORS = { buyer: "#27ae60", admin: "#8e44ad", seller: "#e67e22" };

      function getRole() {
        return localStorage.getItem("swagger_role") || "buyer";
      }

      function applyRole(role) {
        localStorage.setItem("swagger_role", role);
        document.getElementById("role_select").value = role;
        const badge = document.getElementById("role_badge");
        badge.textContent = role;
        badge.style.background = BADGE_COLORS[role] || "#555";
      }

      // Restore saved role on load
      applyRole(getRole());

      document.getElementById("role_select").addEventListener("change", (e) => {
        applyRole(e.target.value);
      });

      // ── Request interceptor — inject X-App-Role + send browser cookies ───────
      function injectHeaders(req) {
        req.headers["X-App-Role"] = getRole();
        req.credentials = "include"; // browser sends httpOnly cookies automatically
        return req;
      }

      // ── Swagger UI init ──────────────────────────────────────────────────────
      fetch("/swagger-config")
        .then((r) => {
          if (!r.ok) throw new Error("Failed to load /swagger-config");
          return r.json();
        })
        .then((cfg) => {
          const urls = cfg.urls || [];

          async function validateSpecs(urlList) {
            const results = [];
            for (const u of urlList) {
              try {
                const res = await fetch(u.url, { credentials: "omit" });
                if (!res.ok) {
                  results.push({ url: u.url, name: u.name, ok: false, status: res.status });
                  continue;
                }
                const ct = res.headers.get("content-type") || "";
                if (!ct.includes("application/json")) {
                  results.push({ url: u.url, name: u.name, ok: false, status: "invalid-content-type" });
                  continue;
                }
                await res.clone().json().catch(() => {
                  results.push({ url: u.url, name: u.name, ok: false, status: "invalid-json" });
                });
                results.push({ url: u.url, name: u.name, ok: true });
              } catch (err) {
                results.push({ url: u.url, name: u.name, ok: false, error: String(err) });
              }
            }
            return results;
          }

          (async () => {
            if (urls.length === 0) {
              SwaggerUIBundle({
                dom_id: "#swagger-ui",
                url: "/docs/swagger.json",
                presets: [SwaggerUIBundle.presets.apis],
                requestInterceptor: injectHeaders,
              });
              return;
            }

            const validation = await validateSpecs(urls);
            const available  = validation.filter((r) => r.ok).map((r) => ({ url: r.url, name: r.name }));
            const failed     = validation.filter((r) => !r.ok);

            if (available.length === 0) {
              console.error("No reachable OpenAPI specs found:", validation);
              document.body.innerHTML =
                '<h2 style="color:#c00;padding:20px">No reachable OpenAPI specs</h2><pre style="padding:20px">' +
                validation.map((v) => JSON.stringify(v)).join("\n") +
                "</pre>";
              return;
            }

            console.log("Swagger UI ready. Specs:", available, "| Failed:", failed);

            SwaggerUIBundle({
              dom_id: "#swagger-ui",
              urls: available,
              presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
              layout: "StandaloneLayout",
              requestInterceptor: injectHeaders,
            });
          })();
        })
        .catch((err) => {
          console.error(err);
          document.body.innerHTML =
            '<h2 style="color:#c00;padding:20px">Failed to load Swagger configuration</h2><pre style="padding:20px">' +
            err.toString() + "</pre>";
        });
    </script>
  </body>
</html>
