basePath: /api/v1
definitions:
  domain.CartItem:
    properties:
      image_url:
        type: string
      is_selected:
        type: boolean
      price:
        type: number
      product_item_id:
        description: ✅ STORED in Redis
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      shop_id:
        description: ❌ NOT stored in Redis - Fetched from Product Service on-demand
        type: integer
      sku_code:
        type: string
    type: object
  domain.Order:
    properties:
      earning_amount:
        type: number
      final_amount:
        type: number
      id:
        type: integer
      items:
        description: Relations
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      merchandise_subtotal:
        description: Financial snapshot (SOURCE OF TRUTH)
        type: number
      order_number:
        description: Business identifiers
        type: string
      ordered_at:
        description: Time
        type: string
      payment_method:
        description: Payment
        type: string
      platform_fee:
        type: number
      shipping_address_id:
        description: Shipping
        type: integer
      shipping_discount:
        type: number
      shipping_fee:
        type: number
      shop_id:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/domain.OrderStatus'
        description: Status
      updated_at:
        type: string
      user_id:
        description: Ownership
        type: integer
      voucher_discount:
        type: number
    type: object
  domain.OrderItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      order_id:
        type: integer
      price_at_purchase:
        type: number
      product_item_id:
        type: integer
      quantity:
        type: integer
    type: object
  domain.OrderStatus:
    enum:
    - pending
    - paid
    - processing
    - shipped
    - delivered
    - cancelled
    type: string
    x-enum-comments:
      OrderStatusCancelled: Order has been cancelled
      OrderStatusDelivered: Order has been delivered
      OrderStatusPaid: Payment completed
      OrderStatusPending: Order created, waiting for payment
      OrderStatusProcessing: Order is being processed
      OrderStatusShipped: Order has been shipped
    x-enum-descriptions:
    - Order created, waiting for payment
    - Payment completed
    - Order is being processed
    - Order has been shipped
    - Order has been delivered
    - Order has been cancelled
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCancelled
  domain.ShoppingCart:
    properties:
      item_count:
        description: |-
          ✅ COMPUTED FIELDS - Cart Service responsibility ONLY
          These are DISPLAY metrics for Cart UI/Badge, NOT checkout logic
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.CartItem'
        type: array
      selected_item_count:
        description: Selected items (rows)
        type: integer
      selected_quantity:
        description: Sum of selected quantities
        type: integer
      selected_total_price:
        description: Total price (selected)
        type: number
      total_price:
        description: Total price (all)
        type: number
      total_quantity:
        description: Sum of all quantities
        type: integer
      user_id:
        type: string
      version:
        type: integer
    type: object
  handler.AddItemRequest:
    properties:
      product_item_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: description of the error
        type: string
    type: object
  handler.SelectAllRequest:
    properties:
      selected:
        type: boolean
    required:
    - selected
    type: object
  handler.SelectShopRequest:
    properties:
      selected:
        type: boolean
    required:
    - selected
    type: object
  handler.SelectionRequest:
    properties:
      selected:
        type: boolean
    required:
    - selected
    type: object
  handler.SuccessResponse:
    properties:
      message:
        example: operation completed successfully
        type: string
    type: object
  handler.UpdateItemRequest:
    properties:
      quantity:
        minimum: 0
        type: integer
    required:
    - quantity
    type: object
  service.CreateOrderRequest:
    properties:
      payment_method:
        type: string
      session_id:
        description: Deprecated
        type: string
      shipping_address:
        type: string
      shipping_address_id:
        description: THÊM MỚI - Reference address table
        type: integer
      shipping_city:
        type: string
      shipping_country:
        type: string
      shipping_discount:
        description: Mã freeship
        type: number
      shipping_fee:
        description: Financial (theo db-diagram.db)
        type: number
      shipping_name:
        description: Shipping information
        type: string
      shipping_phone:
        type: string
      shipping_postal_code:
        type: string
      shipping_province:
        type: string
      user_id:
        type: integer
      voucher_discount:
        description: Mã giảm giá
        type: number
    required:
    - shipping_address
    - shipping_city
    - shipping_name
    - shipping_phone
    type: object
  service.CreateOrderResponse:
    properties:
      order_numbers:
        description: Order numbers for each shop_order
        items:
          type: string
        type: array
      orders:
        description: Multiple shop_orders (1 per shop)
        items:
          $ref: '#/definitions/domain.Order'
        type: array
    type: object
host: localhost:8083
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Order Service API for e-commerce platform - Cart and Order management
    endpoints
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Order Service API
  version: "1.0"
paths:
  /cart:
    delete:
      description: Remove all items from the shopping cart
      produces:
      - application/json
      responses:
        "200":
          description: Cart cleared successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Clear cart
      tags:
      - Cart
    get:
      description: Get the shopping cart for the current user
      produces:
      - application/json
      responses:
        "200":
          description: Cart retrieved successfully
          schema:
            $ref: '#/definitions/domain.ShoppingCart'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Get cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product item (SKU) to the shopping cart
      parameters:
      - description: Add Item Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AddItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Item added successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{product_item_id}:
    delete:
      description: Remove an item from the shopping cart
      parameters:
      - description: Product Item ID (SKU)
        in: path
        name: product_item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item removed successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Update the quantity of an item in the cart
      parameters:
      - description: Product Item ID (SKU)
        in: path
        name: product_item_id
        required: true
        type: integer
      - description: Update Item Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Item updated successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Update item quantity
      tags:
      - Cart
  /cart/items/{product_item_id}/selection:
    patch:
      consumes:
      - application/json
      description: Set the selection state (selected/deselected) for a cart item
      parameters:
      - description: Product Item ID (SKU)
        in: path
        name: product_item_id
        required: true
        type: integer
      - description: Selection Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Item selection updated successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Set item selection
      tags:
      - Cart
  /cart/items/{product_item_id}/toggle:
    post:
      deprecated: true
      description: Toggle the selection state of a cart item
      parameters:
      - description: Product Item ID (SKU)
        in: path
        name: product_item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item selection toggled successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Toggle item selection
      tags:
      - Cart
  /cart/selected:
    delete:
      description: Remove only items that are marked selected (used after checkout)
      produces:
      - application/json
      responses:
        "200":
          description: Selected items cleared successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Clear selected items
      tags:
      - Cart
  /cart/selection:
    patch:
      consumes:
      - application/json
      description: Set selection state for all items in the cart
      parameters:
      - description: Select All Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SelectAllRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Selection updated successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Set selection for all items
      tags:
      - Cart
  /cart/shops/{shop_id}/selection:
    patch:
      consumes:
      - application/json
      description: Set selection state for all items from a shop
      parameters:
      - description: Shop ID
        in: path
        name: shop_id
        required: true
        type: integer
      - description: Select Shop Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SelectShopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Selection updated successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Set selection for shop items
      tags:
      - Cart
  /cart/validate:
    post:
      description: Validate selected items in the cart (ensure stock and availability)
        before checkout
      produces:
      - application/json
      responses:
        "200":
          description: Cart is valid
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Cart invalid
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - UserAuth: []
      summary: Validate cart
      tags:
      - Cart
  /orders:
    get:
      description: Get list of orders for a user or session
      parameters:
      - description: User ID
        in: query
        name: user_id
        type: integer
      - description: Session ID
        in: query
        name: session_id
        type: string
      - description: 'Limit (default: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Orders retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: Create shop_order(s) from the shopping cart. If cart contains items
        from multiple shops, creates multiple shop_orders (1 per shop).
      parameters:
      - description: Order creation request
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/service.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Order(s) created successfully (can be multiple shop_orders)
          schema:
            $ref: '#/definitions/service.CreateOrderResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create order(s) from cart (Marketplace - Multi-shop)
      tags:
      - Order
  /orders/{id}:
    get:
      description: Get order details by order ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order retrieved successfully
          schema:
            $ref: '#/definitions/domain.Order'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get order by ID
      tags:
      - Order
  /orders/number/{order_number}:
    get:
      description: Get order details by order number
      parameters:
      - description: Order Number
        in: path
        name: order_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order retrieved successfully
          schema:
            $ref: '#/definitions/domain.Order'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get order by order number
      tags:
      - Order
schemes:
- http
- https
securityDefinitions:
  UserAuth:
    in: header
    name: X-User-Id
    type: apiKey
swagger: "2.0"
