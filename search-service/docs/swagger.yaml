definitions:
  domain.Product:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      status:
        description: ACTIVE, INACTIVE
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  domain.SearchResult:
    properties:
      limit:
        type: integer
      page:
        type: integer
      products:
        items:
          $ref: '#/definitions/domain.Product'
        type: array
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /search:
    get:
      description: Search products by keyword with filters (category, price range)
        and sort options
      parameters:
      - description: Search keyword
        in: query
        name: q
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Minimum price
        in: query
        name: min_price
        type: number
      - description: Maximum price
        in: query
        name: max_price
        type: number
      - description: Filter by status (ACTIVE, INACTIVE)
        in: query
        name: status
        type: string
      - default: created_at
        description: Sort field (price, name, created_at)
        in: query
        name: sort_field
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Search results
          schema:
            $ref: '#/definitions/domain.SearchResult'
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search products
      tags:
      - Search
swagger: "2.0"
