definitions:
  domain.AdminCategoryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Category'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.CategoryAttribute:
    properties:
      attribute_name:
        description: '"RAM", "Màn hình"'
        type: string
      category_id:
        type: integer
      id:
        type: integer
      input_type:
        description: text, number, select, checkbox
        type: string
      is_filterable:
        description: Hiển thị ở bộ lọc?
        type: boolean
      is_mandatory:
        description: Bắt buộc điền?
        type: boolean
    type: object
  domain.ProductItem:
    properties:
      id:
        type: integer
      image_url:
        type: string
      price:
        type: number
      product_id:
        type: integer
      qty_in_stock:
        type: integer
      sku_code:
        type: string
      status:
        type: string
    type: object
  domain.StockCheckItem:
    properties:
      product_item_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_item_id
    - quantity
    type: object
  domain.StockCheckRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.StockCheckItem'
        type: array
    required:
    - items
    type: object
  domain.StockCheckResponse:
    properties:
      available:
        type: boolean
      unavailable_items:
        items:
          $ref: '#/definitions/domain.UnavailableStockItem'
        type: array
    type: object
  domain.StockDeductItem:
    properties:
      product_item_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_item_id
    - quantity
    type: object
  domain.StockDeductRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.StockDeductItem'
        type: array
      order_id:
        type: string
    required:
    - items
    - order_id
    type: object
  domain.StockReleaseRequest:
    properties:
      order_id:
        type: string
    required:
    - order_id
    type: object
  domain.StockReserveItem:
    properties:
      product_item_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_item_id
    - quantity
    type: object
  domain.StockReserveRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.StockReserveItem'
        type: array
      order_id:
        type: string
    required:
    - items
    - order_id
    type: object
  domain.UnavailableStockItem:
    properties:
      available:
        type: integer
      product_item_id:
        type: integer
      requested:
        type: integer
    type: object
  domain.VariationOption:
    properties:
      id:
        type: integer
      value:
        description: '"M", "L", "XL", "Red", "Blue"'
        type: string
      variation_id:
        type: integer
    type: object
  handler.CategoryActiveRequest:
    properties:
      is_active:
        type: boolean
    type: object
  handler.CategoryResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
    type: object
  handler.CreateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      slug:
        type: string
    required:
    - name
    type: object
  handler.CreateProductRequest:
    properties:
      base_price:
        minimum: 0
        type: number
      category_id:
        description: Must be leaf category
        type: integer
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        type: string
      status:
        type: string
    required:
    - base_price
    - name
    type: object
  handler.ProductResponse:
    properties:
      base_price:
        type: number
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        type: string
      shop_id:
        type: integer
      sold_count:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  handler.UpdateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      slug:
        type: string
    type: object
  handler.UpdateProductRequest:
    properties:
      base_price:
        minimum: 0
        type: number
      category_id:
        type: integer
      description:
        type: string
      images:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        type: string
      status:
        type: string
    type: object
  handler.VariationWithOptions:
    properties:
      id:
        type: integer
      name:
        description: '"Màu Sắc", "Kích Thước"'
        type: string
      options:
        items:
          $ref: '#/definitions/domain.VariationOption'
        type: array
    type: object
  service.CreateCategoryAttributeRequest:
    properties:
      attribute_name:
        maxLength: 50
        minLength: 2
        type: string
      category_id:
        type: integer
      input_type:
        description: text, number, select, checkbox
        type: string
      is_filterable:
        type: boolean
      is_mandatory:
        type: boolean
    required:
    - attribute_name
    - category_id
    - input_type
    type: object
  service.CreateProductItemRequest:
    properties:
      image_url:
        type: string
      price:
        minimum: 0
        type: number
      product_id:
        type: integer
      qty_in_stock:
        type: integer
      sku_code:
        type: string
      variation_options:
        description: List of variation_option_ids (e.g. [1, 5] = Size M + Color Red)
        items:
          type: integer
        type: array
    required:
    - price
    - product_id
    - sku_code
    type: object
  service.SetProductAttributesRequest:
    properties:
      attributes:
        additionalProperties:
          type: string
        description: map[attribute_id]value
        type: object
    required:
    - attributes
    type: object
  service.UpdateProductItemRequest:
    properties:
      image_url:
        type: string
      price:
        minimum: 0
        type: number
      qty_in_stock:
        type: integer
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Get a list of all categories
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            items:
              $ref: '#/definitions/handler.CategoryResponse'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new category with name, slug, optional parent_id, and
        description
      parameters:
      - description: Create Category Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Category created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new category
      tags:
      - Categories
  /categories/{category_id}/attributes:
    get:
      description: Get all attributes for a category
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CategoryAttribute'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get category attributes
      tags:
      - attributes
    post:
      consumes:
      - application/json
      description: Create a new attribute for a category (e.g. RAM, Màn hình for Điện
        thoại category)
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: integer
      - description: Attribute info
        in: body
        name: attribute
        required: true
        schema:
          $ref: '#/definitions/service.CreateCategoryAttributeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CategoryAttribute'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a category attribute
      tags:
      - attributes
  /categories/{category_id}/attributes/{attr_id}:
    delete:
      description: Delete a category attribute
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: integer
      - description: Attribute ID
        in: path
        name: attr_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete category attribute
      tags:
      - attributes
  /categories/{id}:
    delete:
      description: Delete a category by its ID (cannot delete if has children)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid category ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error or category has children
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category
      tags:
      - Categories
    get:
      description: Get a specific category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            $ref: '#/definitions/handler.CategoryResponse'
        "400":
          description: Invalid category ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category by ID
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Update an existing category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Category Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Category updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request payload or category ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an existing category
      tags:
      - Categories
  /categories/{id}/active:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Trạng thái mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CategoryActiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Cập nhật trạng thái kích hoạt của danh mục
      tags:
      - Categories
  /categories/{id}/children:
    get:
      description: Get all child categories of a parent category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of child categories
          schema:
            items:
              $ref: '#/definitions/handler.CategoryResponse'
            type: array
        "400":
          description: Invalid category ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get child categories
      tags:
      - Categories
  /categories/{id}/products:
    get:
      description: Get a paginated list of products filtered by category ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of products with pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid category ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get products by category
      tags:
      - Products
  /categories/admin:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by name or slug
        in: query
        name: search
        type: string
      - description: Filter by status (active/inactive/all)
        in: query
        name: status
        type: string
      - default: id
        description: Sort field (id, name, created_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc/desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AdminCategoryResponse'
      summary: Get categories for admin with pagination, filter and sort
      tags:
      - Admin Categories
  /categories/slug/{slug}:
    get:
      description: Get a specific category by its slug
      parameters:
      - description: Category Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            $ref: '#/definitions/handler.CategoryResponse'
        "400":
          description: Slug is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category by slug
      tags:
      - Categories
  /product-items/{id}/stock:
    get:
      description: Get current stock quantity for a product item (SKU)
      parameters:
      - description: Product Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get stock for a product item
      tags:
      - stock
    put:
      consumes:
      - application/json
      description: Update stock quantity for a product item (for shop owners)
      parameters:
      - description: Product Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Stock update request {new_stock: 100}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update stock quantity
      tags:
      - stock
  /product-items/{sku_code}:
    get:
      description: Get product item by SKU code
      parameters:
      - description: SKU Code
        in: path
        name: sku_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProductItem'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get SKU by code
      tags:
      - skus
  /product-items/batch:
    get:
      description: Fetch multiple product items in one request for cart/order services
      parameters:
      - description: Comma-separated product item IDs (e.g., 1,2,3)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: items array with product details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get multiple product items by IDs (batch)
      tags:
      - skus
  /product-items/check-stock:
    post:
      consumes:
      - application/json
      description: Check if enough stock is available for multiple items
      parameters:
      - description: Stock check request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.StockCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.StockCheckResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Check stock availability
      tags:
      - stock
  /product-items/deduct-stock:
    post:
      consumes:
      - application/json
      description: Deduct stock from product_item.qty_in_stock (after payment confirmed)
      parameters:
      - description: Stock deduct request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.StockDeductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Deduct stock permanently
      tags:
      - stock
  /product-items/release-stock:
    post:
      consumes:
      - application/json
      description: Release stock reservation when order is cancelled or payment failed
      parameters:
      - description: Stock release request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.StockReleaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Release reserved stock
      tags:
      - stock
  /product-items/reserve-stock:
    post:
      consumes:
      - application/json
      description: Temporarily reserve stock during checkout (15 minutes TTL)
      parameters:
      - description: Stock reserve request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.StockReserveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Reserve stock for an order
      tags:
      - stock
  /products:
    get:
      description: Get a paginated list of products with optional filters (category_id,
        status, min_price, max_price, search)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Filter by status (ACTIVE, INACTIVE)
        in: query
        name: status
        type: string
      - description: Minimum price
        in: query
        name: min_price
        type: number
      - description: Maximum price
        in: query
        name: max_price
        type: number
      - description: Search in name and description
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of products with pagination
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List products with pagination and filters
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product with name, description, price, SKU, category,
        status, images, and stock
      parameters:
      - description: Create Product Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new product
      tags:
      - Products
  /products/{id}:
    get:
      description: Get a specific product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
